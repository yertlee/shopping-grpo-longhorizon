name: CI

on:
  push:
  pull_request:

jobs:
  unit:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install lightweight development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run offline CPU unit tests
        run: >-
          python -m pytest -q
          tests/test_imports.py
          tests/test_action_validation.py
          tests/test_shop_tools.py
          tests/test_structured_observation.py
          tests/test_public_entrypoints.py
          tests/test_collection_runtime.py
          tests/test_curation_pipeline.py
          tests/test_process_analyzer.py
          tests/test_quality_summary.py
          tests/test_runtime_contract.py
          tests/test_split_manifest.py
          tests/test_task_reachability.py
          tests/test_upstream_provenance.py
          tests/test_protocol_hash_binding.py
          tests/test_comparison_statistics.py
          tests/test_evaluation_dataset.py
          tests/test_eval_report.py
          tests/test_context_window.py
