# Shopping Agent GRPO configuration.
#
# 冻结合同（HANDOFF_TRAINING_IMPLEMENTATION_GAPS §3 / §6，只允许注释，不做语义修改）：
# - GRPO_MODEL_PATH 必须指向已验收的 M2 merged checkpoint（Process-clean SFT 合并产物，
#   目录内 merge_manifest.json 的 verification.passed 必须为 true；scripts/train_grpo.py
#   启动前 preflight 会强制校验，禁止 adapter 目录或原始 Base）。
# - ref 段显式冻结与 actor 同源：veRL 0.8 的 actor_rollout_ref.ref 配置没有独立的
#   model 节点（ref 直接复用 actor_rollout_ref.model.path，即 ${oc.env:GRPO_MODEL_PATH}
#   指向的同一个 M2 merged checkpoint，绝不是 Base）。禁止在 ref 下新增 model.path 等
#   新键：Hydra struct compose 会拒绝未知键，scripts/check_grpo_runtime.py 的
#   validate_actor_ref_model_contract 也会拒绝任何 ref.model 覆盖；
#   scripts/train_grpo.py preflight 断言 actor/ref resolved 路径逐字节一致。
hydra:
  searchpath:
    - pkg://verl/trainer/config

defaults:
  - ppo_trainer
  - _self_

data:
  train_files: ${oc.env:GRPO_TRAIN_FILE}
  val_files: ${oc.env:GRPO_VAL_FILE}
  train_batch_size: 2
  val_batch_size: 2
  max_prompt_length: 4096
  max_response_length: 20480
  return_raw_chat: true
  filter_overlong_prompts: true
  truncation: error

actor_rollout_ref:
  model:
    path: ${oc.env:GRPO_MODEL_PATH}
    trust_remote_code: true
    enable_gradient_checkpointing: true
    use_remove_padding: false
    lora_rank: 16        # 冻结：GRPO LoRA r=16
    lora_alpha: 32       # 冻结：GRPO LoRA alpha=32
    target_modules: all-linear
    lora:
      merge: true
    override_config:
      attn_implementation: sdpa
  actor:
    ppo_mini_batch_size: 2
    ppo_micro_batch_size_per_gpu: 1
    ppo_max_token_len_per_gpu: 24576
    use_dynamic_bsz: false
    freeze_vision_tower: true
    loss_agg_mode: token-mean
    clip_ratio_low: 0.20
    clip_ratio_high: 0.20
    entropy_coeff: 0.0
    calculate_entropy: true
    use_kl_loss: false
    kl_loss_coef: 0.0
    kl_loss_type: low_var_kl
    optim:
      lr: 1.0e-6         # 冻结：GRPO 学习率 1e-6
      lr_warmup_steps_ratio: 0.03
    fsdp_config:
      optimizer_offload: true
      param_offload: true
  rollout:
    name: vllm
    mode: async
    n: 4
    temperature: 0.7
    top_p: 0.9
    tensor_model_parallel_size: 1
    gpu_memory_utilization: 0.45
    max_num_seqs: 8
    max_model_len: 24576
    max_num_batched_tokens: 24576
    free_cache_engine: true
    calculate_log_probs: true
    log_prob_micro_batch_size_per_gpu: 1
    log_prob_max_token_len_per_gpu: 24576
    log_prob_use_dynamic_bsz: false
    agent:
      num_workers: 8
      default_agent_loop: shopping_tool_agent
      agent_loop_config_path: ${oc.env:SHOPPING_GRPO_ROOT}/configs/agent_loop.yaml
    multi_turn:
      enable: true
      format: qwen3_coder
      max_user_turns: 40
      max_assistant_turns: 40
      max_parallel_calls: 1
      max_tool_response_length: 16384
      tool_response_truncate_side: middle
      tool_config_path: ${oc.env:SHOPPING_GRPO_ROOT}/configs/tools.json
      tokenization_sanity_check_mode: ignore_strippable
    val_kwargs:
      n: 1
      temperature: 0.0
      top_p: 1.0
      do_sample: false
  ref:
    # 冻结 reference：与 actor 完全同源（同一个 M2 merged checkpoint），见文件头说明。
    # 这里只允许设置 ref 的计算参数；任何 model 路径覆盖都会被 runtime preflight 拒绝。
    log_prob_micro_batch_size_per_gpu: 1
    log_prob_max_token_len_per_gpu: 24576
    log_prob_use_dynamic_bsz: false
    fsdp_config:
      param_offload: true

algorithm:
  adv_estimator: grpo
  use_kl_in_reward: false
  norm_adv_by_std_in_grpo: false
  rollout_correction:
    bypass_mode: true
    rollout_is: null
    rollout_rs: null
    loss_type: ppo_clip

# bounded dynamic sampling：补采最多 3 批，连续跳过更新上限 10；数值冻结。
shopping_dynamic_sampling:
  enable: true
  metric: seq_reward
  max_num_gen_batches: 3
  max_consecutive_skipped_updates: 10
  reward_tolerance: 1.0e-8

reward_model:
  enable: false

ray_kwargs:
  ray_init:
    runtime_env:
      worker_process_setup_hook: shopping_grpo.training.grpo.compat.install_torch_padding_fallback

trainer:
  total_epochs: 50
  total_training_steps: 500  # 上限 500；100-step Pilot Gate 通过后才允许继续
  save_freq: 50
  test_freq: 50
  val_before_train: true
  logger: [console]
  project_name: shopping-grpo
  experiment_name: shopping-agent-grpo
  default_local_dir: ${oc.env:GRPO_OUTPUT_DIR}
  n_gpus_per_node: 1
  nnodes: 1
